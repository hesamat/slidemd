<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Deck</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app" class="app">
        <!-- Top Bar -->
        <header id="controlBar" class="topbar">
            <div class="topbar__left">
                <div class="menu-dropdown">
                    <button id="menuBtn" class="icon-btn" type="button" aria-label="Open menu" title="Menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1"></circle>
                            <circle cx="19" cy="12" r="1"></circle>
                            <circle cx="5" cy="12" r="1"></circle>
                        </svg>
                    </button>
                    <div id="menuDropdown" class="menu-dropdown__content webdeck-hidden">
                        <button id="menuOpenFileBtn" class="menu-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Open File</span>
                        </button>
                        <button id="menuOpenRemoteBtn" class="menu-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path
                                    d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                </path>
                            </svg>
                            <span>Open Remote</span>
                        </button>
                        <button id="menuReloadDeckBtn" class="menu-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                            <span>Reload Deck</span>
                        </button>
                        <div class="menu-divider"></div>
                        <button id="menuPrintBtn" class="menu-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2">
                                </path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                            <span>Print PDF</span>
                        </button>
                    </div>
                </div>
                <button id="toggleEditModeBtn" class="icon-btn" type="button" aria-label="Toggle edit mode"
                    title="Edit Mode (E)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
                <h1 id="deckTitle" class="topbar__title">Slide Deck</h1>
            </div>
            <div class="topbar__right">
                <div class="mode-toggles">
                    <button id="openViewerBtn" class="mode-toggle" type="button" aria-label="Open viewer view"
                        title="Presenter View (P)" data-mode="presenter">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="8" y1="21" x2="16" y2="21"></line>
                            <line x1="12" y1="17" x2="12" y2="21"></line>
                        </svg>
                        <span>Presenter</span>
                    </button>
                </div>
                <button id="toggleFullscreenBtn" class="icon-btn" type="button" aria-label="Toggle fullscreen"
                    title="Fullscreen (F)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main">
            <!-- Editor Panel -->
            <aside id="editorPanel" class="editorPanel webdeck-hidden" aria-label="Editor panel">
                <div class="editor__resize-handle" title="Drag to resize panel"></div>
                <div class="editor__header">
                    <div class="editor__actions">
                        <button id="addSlideBtn" class="btn btn--sm" title="Add new slide">+ Add Slide</button>
                        <button id="duplicateSlideBtn" class="btn btn--sm"
                            title="Duplicate current slide">Duplicate</button>
                        <button id="deleteSlideBtn" class="btn btn--sm" title="Delete current slide">Delete</button>
                        <button id="saveSlideBtn" class="btn btn--sm btn--primary" disabled>Save</button>
                    </div>
                </div>
                <!-- Slide Thumbnails Sidebar -->
                <div class="editor__thumbnails">
                    <div class="editor__thumbnails-header">
                        <span class="editor__thumbnails-title">Slides</span>
                        <button id="toggleThumbnailsBtn" class="editor__thumbnails-toggle" type="button" aria-label="Collapse slides"
                            title="Collapse slides">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div id="slideThumbnails" class="slide-thumbnails">
                        <!-- Thumbnails will be generated by JS -->
                    </div>
                </div>
                <div class="editor__body">
                    <div class="editor__body-header">
                        <span class="slide-indicator">1 / 1</span>
                        <h2 class="editor__title">Edit Slide</h2>
                    </div>
                    <div id="markdownEditor" class="markdown-editor-container"></div>
                </div>
            </aside>

            <!-- Viewer Area -->
            <section id="viewer" class="viewer">
                <div id="stageHost" class="stage-host">
                    <div id="deckStage" class="stage" aria-label="Slide stage">
                        <div id="stageInner" class="stage__inner">
                            <div id="slidesContainer" class="slides"></div>
                            <div id="slideIndicator" class="slide-indicator" aria-label="Slide number">
                                <span id="slideNumber">1</span>/<span id="slideCount">1</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Presenter Panel -->
            <aside id="presenterPanel" class="presenterPanel webdeck-hidden" aria-label="Presenter panel">
                <div class="presenter__header">
                    <h2 class="presenter__title">Presenter View</h2>
                </div>
                <div class="presenter__body">
                    <div class="presenter__tools">
                        <label for="breakDuration" class="sr-only">Break length</label>
                        <select id="breakDuration" class="select select--sm" aria-label="Break length">
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10" selected>10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                        </select>
                        <button id="breakBtn" class="btn btn--sm">Break</button>
                    </div>
                    <div class="presenter__section">
                        <h3 class="presenter__sectionTitle">Next Slide</h3>
                        <div id="nextPreview" class="next-preview">No next slide</div>
                    </div>
                    <div class="presenter__section presenter__section--grow">
                        <h3 class="presenter__sectionTitle">Speaker Notes</h3>
                        <div id="notesContainer" class="notes"></div>
                    </div>
                </div>
            </aside>
        </main>

        <footer id="footerBar" class="footer">
            <div class="footer__left">
                <strong>Shortcuts:</strong>
                <span><b>Arrows, Space, PgUp/Dn</b>: Prev/Next</span>
                <span class="viewerOnlyControls">
                    <span>•</span>
                    <span style="padding: 0 6px;"><b>V</b> Open Viewer</span>
                    <span>•</span>
                    <span style="padding: 0 6px;"><b>E</b> Edit Mode</span>
                    <span>•</span>
                    <span style="padding-left: 6px;"><b>R</b> Reload</span>
                </span>
                <span>•</span>
                <span><b>F</b> Full Screen</span>
                <span>•</span>
                <span><b>G</b>: Go to slide</span>
            </div>
            <div class="footer__right">Slide Deck</div>
        </footer>
    </div>
    <!-- Hidden file input for local file loading -->
    <input type="file" id="fileInput" accept=".md" style="display: none;" />

    <!-- Layout Picker Modal -->
    <div id="layoutPickerModal" class="modal webdeck-hidden" role="dialog" aria-modal="true"
        aria-labelledby="layoutPickerTitle">
        <div class="modal__overlay" id="layoutPickerOverlay"></div>
        <div class="modal__dialog">
            <div class="modal__header">
                <h2 id="layoutPickerTitle" class="modal__title">Choose a Layout</h2>
                <button id="closeLayoutPickerBtn" class="modal__close" aria-label="Close">&times;</button>
            </div>
            <div class="modal__body">
                <div id="layoutPickerGrid" class="layout-picker-grid">
                    <!-- Layout options will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="deck.js"></script>
</body>

</html>
