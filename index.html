<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Deck</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app" class="app">
        <!-- Top Bar -->
        <header id="controlBar" class="topbar">
            <div class="topbar__left">
                <span id="roleLabel" class="pill pill--viewer">Viewer Mode</span>
                <h1 id="deckTitle" class="topbar__title">Slide Deck</h1>
            </div>
            <div class="topbar__right">
                <button id="prevBtn" class="btn btn--sm" type="button">Prev</button>
                <button id="nextBtn" class="btn btn--sm" type="button">Next</button>
                <button id="gotoBtn" class="btn btn--sm" type="button">Go to</button>
                <button id="togglePresenterBtn" class="btn">Open Presenter Window</button>
                <button id="printBtn" class="btn">Print PDF</button>
                <div class="hint">
                    <kbd class="kbd">Space</kbd>
                    <span>to navigate</span>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Viewer Area -->
            <section id="viewer" class="viewer">
                <div id="stageHost" class="stage-host">
                    <div id="deckStage" class="stage" aria-label="Slide stage">
                        <div id="stageInner" class="stage__inner">
                            <div id="slidesContainer" class="slides"></div>
                            <div id="slideIndicator" class="slide-indicator" aria-label="Slide number">
                                <span id="slideNumber">1</span>/<span id="slideCount">1</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Presenter Panel -->
            <aside id="presenterPanel" class="presenter webdeck-hidden" aria-label="Presenter panel">
                <div class="presenter__header">
                    <h2 class="presenter__title">Presenter View</h2>
                    <div class="presenter__tools">
                        <span id="timeDisplay" class="mono pill">00:00</span>
                        <button id="timerToggle" class="btn btn--sm">Start</button>
                    </div>
                </div>
                <div class="presenter__body">
                    <div class="presenter__section">
                        <h3 class="presenter__sectionTitle">Next Slide</h3>
                        <div id="nextPreview" class="next-preview">No next slide</div>
                    </div>
                    <div class="presenter__section presenter__section--grow">
                        <h3 class="presenter__sectionTitle">Speaker Notes</h3>
                        <div id="notesContainer" class="notes"></div>
                    </div>
                </div>
            </aside>
        </main>

        <footer id="footerBar" class="footer">
            <div class="footer__left">
                <strong>Shortcuts:</strong>
                <span>←/↑/Space: Prev/Next</span>
                <span>•</span>
                <span>G: Go to slide</span>
                <span>•</span>
                <span>P: Presenter</span>
                <span>•</span>
                <span>E: Export PDF</span>
            </div>
            <div class="footer__right">Slide Deck</div>
        </footer>
    </div>
    <script type="module" src="deck.js"></script>
</body>

</html>
