name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build HTML slides
        run: npm run build -- docs/example/slides.md

      - name: Generate PDF
        run: npm run pdf -- slides.html

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/slides.html
            dist/slides.pdf
          # Regenerates the "What's Changed" section from PRs merged since
          # the previous tag. Disabled only for v1.0.0-beta.1 (the first
          # release, where no previous tag existed and the section would
          # have listed the project's entire pre-release history).
          generate_release_notes: true
