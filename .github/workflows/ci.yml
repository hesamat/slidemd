name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Pushing again to the same PR supersedes the previous run — no point
# finishing a build whose head commit is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The browser set is pinned by the @playwright/test version in the
          # lockfile; fall back to the last known-good cache on any mismatch.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: PPTX import snapshots (headless conversion)
        # vite optimize pre-bundles the dep cache so the CLI's dev server
        # starts in seconds even on a cold runner.
        run: npx vite optimize && npm run test:pptx-import
        timeout-minutes: 15

      - name: End-to-end tests
        run: npm run test:e2e

      # Build/PDF output is only consumed by the main-branch artifact upload;
      # skip the ~1-2 min of rendering on PRs.
      - name: Build HTML slides
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build -- docs/example/slides.md

      - name: Generate PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run pdf -- slides.html

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: dist/
          retention-days: 2
